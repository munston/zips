name: Export Haskell toolchain
on:
  pull_request:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Select Haskell toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          GHC_BIN="$(readlink -f "$(command -v ghc)")"
          CABAL_BIN="$(readlink -f "$(command -v cabal)")"
          GHC_PREFIX="$(dirname "$(dirname "$GHC_BIN")")"
          mkdir -p haskell-toolchain
          tar -C "$GHC_PREFIX" --zstd -cf haskell-toolchain/ghc-prefix.tar.zst .
          cp -L "$CABAL_BIN" haskell-toolchain/cabal
          chmod +x haskell-toolchain/cabal
          cat > haskell-toolchain/install.sh <<'EOF'
          #!/bin/sh
          set -eu
          VERSION=9.6.7
          PREFIX="/usr/local/.ghcup/ghc/$VERSION"
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          mkdir -p "$PREFIX" /usr/local/bin "$HOME/.cabal"
          tar -C "$PREFIX" --zstd -xf "$HERE/ghc-prefix.tar.zst"
          cp "$HERE/cabal" /usr/local/bin/cabal
          chmod +x /usr/local/bin/cabal
          for f in "$PREFIX"/bin/*; do
            [ -x "$f" ] || continue
            ln -sf "$f" "/usr/local/bin/$(basename "$f")"
          done
          if [ -f "$HOME/.cabal/config" ]; then
            if grep -q '^active-repositories:' "$HOME/.cabal/config"; then
              sed -i 's/^active-repositories:.*/active-repositories: none/' "$HOME/.cabal/config"
            else
              printf '\nactive-repositories: none\n' >> "$HOME/.cabal/config"
            fi
          else
            printf 'active-repositories: none\n' > "$HOME/.cabal/config"
          fi
          ghc --version
          cabal --version
          EOF
          chmod +x haskell-toolchain/install.sh
          {
            ghc --version
            cabal --version
            printf 'ghc_prefix=%s\n' "$GHC_PREFIX"
          } > haskell-toolchain/manifest.txt
      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: haskell-linux-x86_64-ghc-9.6.7-cabal-3.10.3.0
          path: haskell-toolchain
          compression-level: 0
          retention-days: 1
