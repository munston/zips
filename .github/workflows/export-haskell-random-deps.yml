name: Export Haskell random deps
on:
  pull_request:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps
          curl -L --fail -o deps/splitmix-0.1.3.2.tar.gz https://hackage.haskell.org/package/splitmix-0.1.3.2/splitmix-0.1.3.2.tar.gz
          curl -L --fail -o deps/random-1.2.1.3.tar.gz https://hackage.haskell.org/package/random-1.2.1.3/random-1.2.1.3.tar.gz
          curl -L --fail -o deps/split-0.2.5.tar.gz https://hackage.haskell.org/package/split-0.2.5/split-0.2.5.tar.gz
          sha256sum deps/* > deps/SHA256SUMS
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: haskell-random-deps
          path: deps
          compression-level: 0
          retention-days: 1
